name: Build multi-platform binaries

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            python: '3.11'
            node: '20'
            dist_dir: dist/windows
            artifact_path: dist/windows
          - os: macos-13
            label: macos-intel
            python: '3.11'
            node: '20'
            dist_dir: dist/macos-x86_64
            artifact_path: dist/macos-x86_64
            target_arch: x86_64
          - os: macos-14
            label: macos-apple-silicon
            python: '3.11'
            node: '20'
            dist_dir: dist/macos-arm64
            artifact_path: dist/macos-arm64
            target_arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STRICT_EMBED_NODE_RUNTIME: '1'
        run: |
          ./scripts/build_windows.ps1 -PythonExe python -DistDir "${{ matrix.dist_dir }}"

      - name: Build on macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          STRICT_EMBED_NODE_RUNTIME: '1'
        run: |
          ./scripts/build_macos.sh "${{ matrix.target_arch }}" "${{ matrix.dist_dir }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
